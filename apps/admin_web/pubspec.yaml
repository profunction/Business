name: jb_admin
description: "新山批发：客服后台（Flutter Web）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.3
  # 佣金账单 PDF（中文字体打包在 assets/fonts）
  pdf: ^3.13.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  # 网页下载档案（CSV、PDF）
  web: ^1.1.1
  wholesale_core:
    path: ../../packages/core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    # 账单 PDF 的中文字体（TrueType .ttf，跟 apps/mobile 一样）
    - assets/fonts/NotoSansSC-Regular.ttf
